<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VennRPG Character Sheet</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div class="sheet">

  <header class="sheet-header">
    <h1>VennRPG Character Sheet</h1>
    <div class="header-row">
      <label class="name-field">
        Character Name
        <input type="text" id="charName" placeholder="Unnamed">
      </label>
      <label class="race-field">
        Race
        <select id="raceSelect"></select>
      </label>
      <label class="focus-field">
        Focus
        <select id="focusSelect"></select>
      </label>
      <div class="header-actions">
        <button id="newCharacterBtn" type="button" class="secondary">New Character</button>
        <button id="saveBtn" type="button">Save Character</button>
        <button id="loadBtn" type="button">Load Character</button>
        <input type="file" id="loadInput" accept="application/json,.json" hidden>
      </div>
    </div>
  </header>

  <main class="sheet-body">

    <section class="panel attributes-panel">
      <div class="panel-title-row">
        <h2>Attributes</h2>
        <button id="rollAllBtn" type="button" class="dice-btn">🎲 Roll All</button>
      </div>
      <div class="attribute-row attribute-row-header">
        <span></span>
        <span class="col-label">Value</span>
        <span class="col-label">Defy</span>
        <span></span>
      </div>
      <div id="attributesList" class="attributes-list"></div>
      <div id="combatStatsList" class="derived-stats-list"></div>
    </section>

    <div class="right-column">
      <section class="panel classes-panel">
        <h2>Classes</h2>
        <div id="classesList" class="classes-list"></div>
      </section>

      <section class="panel vitals-panel">
        <h2>Vitals</h2>
        <div class="vitals-freeform-row">
          <label class="vitals-freeform-field">
            Height
            <input type="text" id="vitalsHeight">
          </label>
          <label class="vitals-freeform-field">
            Weight
            <input type="text" id="vitalsWeight">
          </label>
        </div>
        <div id="vitalsList" class="vitals-list"></div>
      </section>
    </div>

  </main>

  <section class="panel weapons-panel">
    <div class="panel-title-row">
      <h2>Weapons</h2>
      <button type="button" class="collapse-toggle" id="weaponsCollapseToggle" aria-expanded="true">▾</button>
    </div>
    <div class="collapsible-body" id="weaponsBody">
      <div id="weaponsTabs" class="skills-tabs"></div>
      <div id="weaponsSummary" class="skills-summary"></div>
      <div id="weaponsFocusSummary" class="skills-summary"></div>
      <div class="weapons-tables">
        <div class="weapons-table-group">
          <h3 class="derived-stats-title">Melee Weapons</h3>
          <div class="weapons-table-wrap">
            <table class="weapons-table">
              <thead>
                <tr>
                  <th>Weapon</th>
                  <th>ROF</th>
                  <th>Target</th>
                  <th>B</th>
                  <th>S</th>
                  <th>P</th>
                  <th>E</th>
                </tr>
              </thead>
              <tbody id="meleeWeaponsBody"></tbody>
            </table>
          </div>
        </div>
        <div class="weapons-table-group">
          <h3 class="derived-stats-title">Ranged Weapons</h3>
          <div class="weapons-table-wrap">
            <table class="weapons-table">
              <thead>
                <tr>
                  <th>Weapon</th>
                  <th>ROF</th>
                  <th>Target</th>
                  <th>B</th>
                  <th>S</th>
                  <th>P</th>
                  <th>E</th>
                </tr>
              </thead>
              <tbody id="rangedWeaponsBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="panel skills-panel">
    <div class="panel-title-row">
      <h2>Skills</h2>
      <button type="button" class="collapse-toggle" id="skillsCollapseToggle" aria-expanded="true">▾</button>
    </div>
    <div class="collapsible-body" id="skillsBody">
      <div id="skillsTabs" class="skills-tabs"></div>
      <div id="skillsSummary" class="skills-summary"></div>
      <div id="skillsList" class="skills-list"></div>
    </div>
  </section>

  <section class="panel specials-panel">
    <div class="panel-title-row">
      <h2>Specials</h2>
      <button type="button" class="collapse-toggle" id="specialsCollapseToggle" aria-expanded="true">▾</button>
    </div>
    <div class="collapsible-body" id="specialsBody">
      <div id="specialsSummary" class="skills-summary"></div>
      <div id="specialsTierSummary" class="skills-summary"></div>
      <div id="specialsList" class="specials-list"></div>
    </div>
  </section>

  <section class="panel spells-panel" id="spellsPanel" hidden>
    <div class="panel-title-row">
      <h2>Spells</h2>
      <button type="button" class="collapse-toggle" id="spellsCollapseToggle" aria-expanded="true">▾</button>
    </div>
    <div class="collapsible-body" id="spellsBody">
      <div id="spellsList" class="spells-list"></div>
    </div>
  </section>

  <section class="panel spells-panel" id="miraclesPanel" hidden>
    <div class="panel-title-row">
      <h2>Miracles</h2>
      <button type="button" class="collapse-toggle" id="miraclesCollapseToggle" aria-expanded="true">▾</button>
    </div>
    <div class="collapsible-body" id="miraclesBody">
      <div id="miraclesList" class="spells-list"></div>
    </div>
  </section>

</div>

<script src="src/data.js"></script>
<script src="src/app.js"></script>
</body>
</html>
